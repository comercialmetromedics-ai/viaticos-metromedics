name: Desempacar codigo
on:
  push:
    paths: ['app.tar.gz']
permissions:
  contents: write
  actions: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer y guardar el codigo
        run: |
          tar xzf app.tar.gz
          git rm -q app.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Codigo de la app de viaticos"
          git push
      - name: Publicar
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
